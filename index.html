<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script>
    if (!new URLSearchParams(window.location.search).has('building')) {
      window.location.replace('./map.html')
    }
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:,">
  <title>3D Detail View</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app" id="app">
    <div class="scene-layer" id="scene-layer"></div>
    <div class="copy-layer" id="copy-layer"></div>
    <div class="scrub-track">
      <div class="scrub-fill" id="scrub-fill"></div>
    </div>
    <div class="mode-toggle" id="mode-toggle">
      <button class="mode-btn active" id="btn-read">Read Story</button>
      <button class="mode-btn" id="btn-explore">Explore 3D</button>
    </div>
    <div class="status-chip" id="status-chip">Loading model...</div>
    <section class="arch-loader-overlay" id="model-loader" role="status" aria-live="polite" aria-label="3D model loading progress">
      <div class="loader-ring"></div>

      <div class="loader-content">
        <div class="loader-subtitle">CONSTRUCTING DIGITAL TWIN</div>
        <div class="loader-percentage"><span id="model-loader-percent">0</span>%</div>
      </div>

      <div class="loader-fact-container">
        <p class="loader-fact" id="model-loader-fact"></p>
      </div>
    </section>
  </main>

  <script type="module" src="./main.mjs"></script>
</body>
</html>
